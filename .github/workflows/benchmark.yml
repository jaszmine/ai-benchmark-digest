name: AI Benchmark Telemetry Pipeline

on:
  schedule:
    # 8:23 AM Central Time (13:23 UTC during Daylight Saving Time)
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Deploy to GitHub Pages only (skip benchmark pipeline, uses 0 tokens)"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'artifacts/**'
      - 'scripts/build_dashboard.py'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Log Timestamp
        run: |
          echo "Run started at: $(date)"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --frozen

      # Step 1: Execute benchmark ONLY if scheduled or manually requested with deploy_only == false
      - name: Execute Benchmark Pipeline
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy_only == false) }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
          MODEL_NAME: "nvidia/nemotron-3-super-120b-a12b:free"
          APP_REFERER: "https://github.com/${{ github.repository }}"
          APP_TITLE: "AI Benchmark Digest"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
          LOOKBACK_DAYS: 7
          MAX_TRACK_B_TURNS: 3
          INTER_TURN_SLEEP_SECONDS: 3.0
          INTER_TRACK_PAUSE_SECONDS: 20.0
        run: |
          uv run python -c "import asyncio; from src.main import orchestrate_benchmark; asyncio.run(orchestrate_benchmark(send_email=True))"

      # Step 2: If we skipped the benchmark, rebuild dashboard pages from existing local artifacts
      - name: Rebuild Dashboard and Digest Archive Pages
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_only == true) }}
        run: |
          uv run python scripts/build_dashboard.py

      # Step 3: Commit and push newly compiled artifacts back to main
      - name: Commit and Persist Artifacts Permanently
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          if git diff --staged --quiet; then
            echo "No new artifacts to commit."
          else
            git commit -m "chore(telemetry): update dashboard and digest viewer [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Step 4: Publish to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4