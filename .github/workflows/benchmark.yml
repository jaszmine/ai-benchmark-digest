name: AI Benchmark Telemetry Pipeline

on:
  schedule:
    # Runs at 8:00 AM Central Time every day (handles CDT/CST automatically)
    # setting to 10:20am for test run 16
    - cron: '20 10 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

# grant runner write permissions so it can push artifacts back to main
permissions:
  contents: write

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Log Timestamp
        run: |
          echo "Run started at: $(date)"
          echo "Target schedule: 8:00 AM America/Chicago"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Execute Benchmark Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
          MODEL_NAME: "nvidia/nemotron-3-super-120b-a12b:free"
          APP_REFERER: "https://github.com/${{ github.repository }}"
          APP_TITLE: "AI Benchmark Digest"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
          LOOKBACK_DAYS: 7
          MAX_TRACK_B_TURNS: 3
          INTER_TURN_SLEEP_SECONDS: 3.0
          INTER_TRACK_PAUSE_SECONDS: 20.0
        run: |
          uv run python -c "import asyncio; from src.main import orchestrate_benchmark; asyncio.run(orchestrate_benchmark(send_email=True))"

      - name: Commit and Persist Artifacts Permanently
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          if git diff --staged --quiet; then
            echo "No new artifacts to commit."
          else
            git commit -m "chore(telemetry): record benchmark run artifacts [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi