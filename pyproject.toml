[project]
name = "ai-benchmark-digest"
version = "0.1.0"
description = "Deterministic Workflow vs Autonomous Agent comparative benchmark under model parity."
authors = [
    { name = "Benchmark Engineer", email = "engineer@example.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "httpx>=0.27.0,<0.28.0",
    "feedparser>=6.0.11,<7.0.0",
    "langchain-core>=0.2.0,<0.4.0",
    "langchain-openai>=0.1.7,<0.3.0",
    "langgraph>=0.1.0,<0.3.0",
    "tavily-python>=0.3.3,<0.5.0",
    "jinja2>=3.1.4,<4.0.0",
    "resend>=2.0.0,<3.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "matplotlib>=3.11.1",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.4",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["B008"]
